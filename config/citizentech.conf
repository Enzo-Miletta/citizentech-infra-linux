# =====================================================================
#  CitizenTech - Configuração central do servidor
#  Todos os scripts leem este arquivo. Edite APENAS aqui.
# =====================================================================

# ---------- Identificação (aparece no site, nos logs e nos prints) ----
# Responsável pelo servidor (mesmo nome/RM usado no nome da VM)
ALUNO_NOME="Enzo Miletta"
ALUNO_RM="98677"

# Equipe completa (aparece no rodapé do site). Formato: "Nome|RM;Nome|RM"
EQUIPE="Renato Luiz Cordão|556403;Vitor Victorino Couto|554965;Victoria Moura|555474;Fabricio Bettarello|554638;Enzo Miletta|98677"

# ---------- Rede (IP fixo) --------------------------------------------
# Interface ligada à rede onde está o cliente Windows (ex.: enp0s8).
# Vazio = detecção automática (interface que já tem o SERVER_IP ou a
# primeira interface física SEM rota padrão, ou seja, a host-only).
NET_IFACE=""
SERVER_IP="192.168.56.10"
NET_PREFIX="24"
# Gateway da interface acima. Deixe vazio na rede host-only (a internet
# continua saindo pelo adaptador NAT). Preencha se usar um único adaptador
# (Bridge / Rede NAT), ex.: "192.168.0.1".
NET_GATEWAY=""

# ---------- Identidade do servidor e domínio --------------------------
SERVER_HOSTNAME="srv01"
DOMAIN="conectacidadao.com.br"

# ---------- Aplicação web ---------------------------------------------
SITE_NAME="Conecta Cidadão"
WEB_ROOT="/var/www/${DOMAIN}"

# ---------- Serviços ----------------------------------------------------
DNS_SERVICE="named"                # BIND9 (alias: bind9)
WEB_SERVICE="apache2"
UFW_ENABLE="true"                  # firewall: libera só 22, 53 e 80

# ---------- Monitoramento ----------------------------------------------
MON_INTERVAL=10                    # segundos entre cada coleta
CPU_LIMIT=80                       # % - acima disso gera alerta
MEM_LIMIT=80                       # %
DISK_LIMIT=85                      # %
DISK_MOUNT="/"
MON_SERVICES="named apache2"       # serviços vigiados
MON_AUTOHEAL="true"                # reinicia serviço parado automaticamente
MON_WALL="true"                    # mostra o alerta em todos os terminais abertos
